            let m;
            if (s.deco && (m = /^@[A-Za-z_][\w.]*/.exec(rest))) { push("d", m[0]); i += m[0].length; prev = ""; continue; }
            if ((m = /^\d[\d_]*(\.\d+)?([eE][+-]?\d+)?[a-zA-Z]*/.exec(rest)) && !/[\w$]/.test(line[i - 1] || "")) { push("nu", m[0]); i += m[0].length; prev = ""; continue; }
            if ((m = /^[A-Za-z_$][\w$]*/.exec(rest))) {
              const w = m[0];
              if (kw.has(s.ci ? w.toLowerCase() : w)) { push("k", w); prev = w; }
              else if (DEF_WORDS.has(prev)) { push("f", w); prev = ""; }
              else if (/^[A-Z]/.test(w) || types.has(w)) { push("t", w); prev = ""; }
              else { push("", w); prev = ""; }
              i += w.length;
              continue;
            }
            if (!/\s/.test(line[i])) prev = "";
            push("", line[i]);
            i++;
          }
          if (state && state.type === "str" && !state.multi) state = null;
          return out || " ";
        });
      };
    }

    // ---- Build the boxes once; layouts only move them ----
    const viewport = $("viewport"), world = $("world"), ink = $("ink");
    const framesLayer = $("frames"), edgesLayer = $("edges"), overLayer = $("edges-over"), boxesLayer = $("boxes"), headsLayer = $("heads");
    const rc = window.rough && typeof window.rough.svg === "function" ? window.rough.svg(ink) : null;
    const root = (META.root || "").replace(/\\/g, "/");
    const fileUrl = (file, line) => {
      const abs = (root.startsWith("/") ? root : "/" + root) + "/" + file;
      // Encode each path segment, so "#" or "?" in a name stays part of the path.
      return "vscode://file" + abs.split("/").map((seg) => /^[A-Za-z]:$/.test(seg) ? seg : encodeURIComponent(seg)).join("/") + ":" + line;
    };
    const els = {}, frames = {};
    const ordered = BLOCKS.filter((b) => b.role === "container").concat(BLOCKS.filter((b) => b.role !== "container"));
    for (const b of ordered) {
      const el = document.createElement("div");
      el.className = `box ${b.role}${b.status ? " " + b.status : ""}`;
      el.dataset.id = b.id;
      if (b.role !== "container") { el.tabIndex = 0; el.setAttribute("role", "button"); }
      el.setAttribute("aria-label", `${b.id}, ${b.file} lines ${b.start} to ${b.end}`);
      const marks = b.marks || {};
      const add = new Set(marks["+"] || []), del = new Set(marks["-"] || []);
      const html = tokenizer(b.lang)(b.lines);
      const badge = b.status && b.status !== "same" ? `<span class="badge ${b.status}">${b.status}</span>` : "";
      el.innerHTML =
        (b.label ? `<div class="tag">${esc(b.label)}</div>` : "") +
        `<div class="cap"><a href="${esc(fileUrl(b.file, b.start))}" title="Open in VS Code">${esc(b.file)}:${b.start}–${b.end}</a>${badge}<span class="n"></span></div>` +
        html.map((h, i) => `<div class="l${add.has(i) ? " add" : ""}${del.has(i) ? " del" : ""}" data-i="${i}">${h}</div>`).join("") +
        (b.tail ? `<div class="tail">${tokenizer(b.lang)([b.tail])[0]}</div>` : "");
      boxesLayer.appendChild(el);
      els[b.id] = el;
    }

    function sizeBoxes(P) {
      for (const b of BLOCKS) {
        const r = P[b.id];
        els[b.id].style.width = r[2] + "px";
        els[b.id].style.height = r[3] + "px";
      }
    }
    function buildFrames(P) {
      framesLayer.replaceChildren();
      for (const b of ordered) {
        const [, , w, h] = P[b.id];
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", `frame ${b.role}`);
        if (rc) {
          const rough = b.role === "container" ? { roughness: 1.2, bowing: 1.2 } : { roughness: 1.5, bowing: 2 };
          g.appendChild(rc.rectangle(-5, -5, w + 10, h + 10, { ...rough, strokeWidth: 1.6, seed: hash(b.id) }));
        } else {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", `M-4,-5 L${w + 5},-4 L${w + 4},${h + 5} L-5,${h + 4} Z`);
          g.appendChild(p);
        }
        framesLayer.appendChild(g);
        frames[b.id] = g;
      }
    }

    // ---- Arrows: leave from the line that mentions the target, enter at its declaration ----
    function anchors(e, P) {
      const s = P[e.from], t = P[e.to];
      const sy = s[1] + CAP + (e.line + 0.5) * LH;
      const ty = t[1] + CAP + (BY[e.to].def + 0.5) * LH;
      const sL = s[0], sR = s[0] + s[2], tL = t[0], tR = t[0] + t[2];
      if (tL >= sR + 12) return { mode: "rl", sx: sR + 6, sy, tx: tL - 7, ty };
      if (tR <= sL - 12) return { mode: "lr", sx: sL - 6, sy, tx: tR + 7, ty };
      return { mode: "ll", sx: sL - 6, sy, tx: tL - 7, ty };
    }
    function geometry(a) {
      if (a.mode === "rl") {
        const dx = Math.max(44, (a.tx - a.sx) * 0.5);
        return { d: `M${a.sx},${a.sy} C${a.sx + dx},${a.sy} ${a.tx - dx},${a.ty} ${a.tx},${a.ty}`, cx: a.tx - dx, cy: a.ty };
      }
      if (a.mode === "lr") {
        const dx = Math.max(44, (a.sx - a.tx) * 0.5);
        return { d: `M${a.sx},${a.sy} C${a.sx - dx},${a.sy} ${a.tx + dx},${a.ty} ${a.tx},${a.ty}`, cx: a.tx + dx, cy: a.ty };
      }
      const lx = Math.min(a.sx, a.tx) - (26 + Math.min(64, Math.abs(a.ty - a.sy) * 0.12));
      return { d: `M${a.sx},${a.sy} C${lx},${a.sy} ${lx},${a.ty} ${a.tx},${a.ty}`, cx: lx, cy: a.ty };
    }
    function headPath(a, g) {
      const ang = Math.atan2(a.ty - g.cy, a.tx - g.cx), L = 9, w = 0.42;
      return `M${a.tx - L * Math.cos(ang - w)},${a.ty - L * Math.sin(ang - w)} L${a.tx},${a.ty} L${a.tx - L * Math.cos(ang + w)},${a.ty - L * Math.sin(ang + w)}`;
    }

    let mode = META.default === "beside" ? "beside" : "column";
    if (location.hash === "#beside" || location.hash === "#column") mode = location.hash.slice(1);
    let P = null, cur = null, sel = null, touched = false;
    let cam = { x: 0, y: 0, s: 1 };

    function renderEdges(Pos, sketchy) {
      edgesLayer.replaceChildren();
      overLayer.replaceChildren();
      for (const e of EDGES) {
        const a = anchors(e, Pos), g = geometry(a), h = headPath(a, g);
        const on = !!sel && (e.from === sel || e.to === sel);
        const eg = document.createElementNS(NS, "g");
        eg.setAttribute("class", `edge ${e.kind}${e.primary ? "" : " sec"}${on ? " on" : ""}`);
        if (sketchy && rc) {
          eg.appendChild(rc.path(g.d, { roughness: 0.85, bowing: 0.8, strokeWidth: 1.5, seed: e.seed }));
          const hg = rc.path(h, { roughness: 0.3, bowing: 0, strokeWidth: 1.5, seed: e.seed + 7 });
          hg.setAttribute("class", "head");
          eg.appendChild(hg);
        } else {
          const p1 = document.createElementNS(NS, "path"); p1.setAttribute("d", g.d);
          const p2 = document.createElementNS(NS, "path"); p2.setAttribute("d", h); p2.setAttribute("class", "head");
          eg.append(p1, p2);
        }
        e.el = eg;
        e.over = eg.cloneNode(true);
        edgesLayer.appendChild(eg);
        overLayer.appendChild(e.over);
      }
    }
    function place(Pos) {
      for (const b of BLOCKS) {
        const r = Pos[b.id];
        els[b.id].style.transform = `translate(${r[0]}px, ${r[1]}px)`;
        frames[b.id].setAttribute("transform", `translate(${r[0]} ${r[1]})`);
      }
    }
    function renderHeads(L) {
      headsLayer.replaceChildren();
      for (const [text, x, y] of DATA.layouts[L].heads) {
        const d = document.createElement("div");
        d.className = "head-label";
        d.textContent = text;
        d.style.transform = `translate(${x}px, ${y}px)`;
        headsLayer.appendChild(d);
      }
    }
    function applyCam() {
      world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
      const g = 24 * cam.s;
      viewport.style.backgroundSize = `${g}px ${g}px`;
      viewport.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
    }
    function fitCam(L) {
      const [x0, y0, x1, y1] = DATA.layouts[L].bounds;
      const vw = viewport.clientWidth, vh = viewport.clientHeight;
      const top = vw < 760 ? 230 : 150, bottom = 70, side = 24;
      const w = x1 - x0, h = y1 - y0;
      const s = clamp(Math.min((vw - side * 2) / w, (vh - top - bottom) / h), 0.08, 1.15);
      return { s, x: (vw - w * s) / 2 - x0 * s, y: top + (vh - top - bottom - h * s) / 2 - y0 * s };
    }

    let raf = 0;
    const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
    function tween(ms, step, done) {
      cancelAnimationFrame(raf);
      if (reduce || ms <= 0) { step(1); if (done) done(); return; }
      const t0 = performance.now();
      const tick = (now) => {
        const k = Math.min(1, (now - t0) / ms);
        step(ease(k));
        if (k < 1) raf = requestAnimationFrame(tick);
        else if (done) done();
      };
      raf = requestAnimationFrame(tick);
    }
    const lerp = (a, b, k) => a + (b - a) * k;
    function lerpPos(A, B, k) {
      const out = {};
      for (const id of Object.keys(B)) { const a = A[id], b = B[id]; out[id] = [lerp(a[0], b[0], k), lerp(a[1], b[1], k), b[2], b[3]]; }
      return out;
    }
    const lerpCam = (A, B, k) => ({ x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), s: lerp(A.s, B.s, k) });

    function applySel() {
      world.classList.toggle("has-sel", !!sel);
      boxesLayer.querySelectorAll(".l.hit").forEach((n) => n.classList.remove("hit"));
      const rel = new Set();
      for (const e of EDGES) {
        const on = !!sel && (e.from === sel || e.to === sel);
        if (e.el) e.el.classList.toggle("on", on);
        if (e.over) e.over.classList.toggle("on", on);
        if (on) {
          rel.add(e.from); rel.add(e.to);
          const ln = els[e.from].querySelector(`.l[data-i="${e.line}"]`);
          if (ln) ln.classList.add("hit");
        }
      }
      for (const b of BLOCKS) {
        const isSel = b.id === sel, isRel = rel.has(b.id) && !isSel;
        els[b.id].classList.toggle("sel", isSel); els[b.id].classList.toggle("rel", isRel);
        frames[b.id].classList.toggle("sel", isSel); frames[b.id].classList.toggle("rel", isRel);
      }
      const order = DATA.layouts[mode].order, i = sel ? order.indexOf(sel) : -1;
      $("step-label").textContent = i >= 0 ? `${i + 1} / ${order.length} · ${sel}` : "Step through the reading order";
    }
    function numberBoxes() {
      for (const b of BLOCKS) { const n = els[b.id].querySelector(".n"); if (n) n.textContent = ""; }
      DATA.layouts[mode].order.forEach((id, i) => { const n = els[id].querySelector(".n"); if (n) n.textContent = String(i + 1); });
      $("order-key").textContent = `1–${DATA.layouts[mode].order.length} reading order`;
    }
    const RULES = {
      column: "Read left to right: the entry point, then what it calls, in call order. Types are in the last column.",
      beside: "Read left to right: the entry point, then what it calls, in call order. Each type sits under the first code that uses it.",
    };
    function markMode() {
      $("mode-column").setAttribute("aria-pressed", String(mode === "column"));
      $("mode-beside").setAttribute("aria-pressed", String(mode === "beside"));
      $("rule").textContent = RULES[mode];
    }

    function setMode(L, animate) {
      mode = L;
      markMode();
      numberBoxes();
      try { history.replaceState(null, "", "#" + L); } catch (err) { /* a file: URL may refuse; the switch still works */ }
      const to = DATA.layouts[L].boxes, from = cur;
      P = to;
      const camFrom = { ...cam }, camTo = fitCam(L);
      touched = false;
      if (!from || !animate) {
        cur = to; place(cur); cam = camTo; applyCam(); renderEdges(cur, true); renderHeads(L); applySel();
        return;
      }
      headsLayer.replaceChildren();
      tween(760, (k) => {
        cur = lerpPos(from, to, k); place(cur);
        cam = lerpCam(camFrom, camTo, k); applyCam();
        renderEdges(cur, false); applySel();
      }, () => { cur = to; renderEdges(to, true); renderHeads(L); applySel(); });
    }
    function moveCam(target, ms) {
      const from = { ...cam };
      tween(ms, (k) => { cam = lerpCam(from, target, k); applyCam(); });
    }
    function zoomAt(px, py, factor) {
      const s = clamp(cam.s * factor, 0.08, 2.6);
      cam = { s, x: px - (px - cam.x) * (s / cam.s), y: py - (py - cam.y) * (s / cam.s) };
      touched = true;
      applyCam();
    }
    function focusBox(id) {
      const r = P[id], vw = viewport.clientWidth, vh = viewport.clientHeight;
      const k = clamp(Math.min((vw - 60) / r[2], (vh - 220) / r[3], 1.15), 0.25, 1.15);
      touched = true;
      moveCam({ s: k, x: vw / 2 - (r[0] + r[2] / 2) * k, y: vh / 2 + 10 - (r[1] + r[3] / 2) * k }, 420);
    }
    function select(id) { sel = id; applySel(); }
    function step(dir) {
      const order = DATA.layouts[mode].order;
      let i = sel ? order.indexOf(sel) : -1;
      i = i < 0 ? (dir > 0 ? 0 : order.length - 1) : (i + dir + order.length) % order.length;
      select(order[i]);
      focusBox(order[i]);
    }

    // ---- Pointer and keys ----
    const pts = new Map();
    let drag = null, pinch = null;
    viewport.addEventListener("pointerdown", (ev) => {
      if (ev.button > 0 || (ev.target.closest && ev.target.closest("a"))) return;
      viewport.setPointerCapture(ev.pointerId);
      pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pts.size === 1) drag = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y, moved: false, target: ev.target };
      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s, cx: cam.x, cy: cam.y, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
        drag = null;
      }
    });
    viewport.addEventListener("pointermove", (ev) => {
      if (!pts.has(ev.pointerId)) return;
      pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch && pts.size >= 2) {
        const [a, b] = [...pts.values()];
        const s = clamp(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.08, 2.6);
        cam = { s, x: pinch.mx - (pinch.mx - pinch.cx) * (s / pinch.s), y: pinch.my - (pinch.my - pinch.cy) * (s / pinch.s) };
        touched = true; applyCam();
        return;
      }
      if (!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; viewport.classList.add("dragging"); }
      if (drag.moved) { cam = { ...cam, x: drag.cx + dx, y: drag.cy + dy }; touched = true; applyCam(); }
    });
    function endPointer(ev) {
      if (!pts.has(ev.pointerId)) return;
      pts.delete(ev.pointerId);
      if (pts.size < 2) pinch = null;
      if (drag && pts.size === 0) {
        if (!drag.moved && ev.type === "pointerup") {
          const box = drag.target && drag.target.closest ? drag.target.closest(".box:not(.container)") : null;
          select(box ? (box.dataset.id === sel ? null : box.dataset.id) : null);
        }
        viewport.classList.remove("dragging");
        drag = null;
      }
    }
    viewport.addEventListener("pointerup", endPointer);
    viewport.addEventListener("pointercancel", endPointer);
    viewport.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      // Firefox reports line or page steps for a mouse wheel; turn them into pixels.
      const unit = ev.deltaMode === 1 ? 16 : ev.deltaMode === 2 ? viewport.clientHeight : 1;
      const dx = ev.deltaX * unit, dy = ev.deltaY * unit;
      if (ev.ctrlKey || ev.metaKey) zoomAt(ev.clientX, ev.clientY, Math.exp(-dy * 0.0022));
      else { cam = { ...cam, x: cam.x - dx, y: cam.y - dy }; touched = true; applyCam(); }
    }, { passive: false });
    document.addEventListener("keydown", (ev) => {
      if (ev.target.closest && ev.target.closest("button, a, summary")) return;
      if (ev.key === "ArrowRight") { ev.preventDefault(); step(1); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); step(-1); }
      else if (ev.key === "Escape") { select(null); $("claim").hidden = true; }
      else if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("box")) { ev.preventDefault(); select(ev.target.dataset.id); }
    });

    $("mode-column").addEventListener("click", () => { if (mode !== "column") setMode("column", true); });
    $("mode-beside").addEventListener("click", () => { if (mode !== "beside") setMode("beside", true); });
    $("zoom-in").addEventListener("click", () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25));
    $("zoom-out").addEventListener("click", () => zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.8));
    $("zoom-fit").addEventListener("click", () => { touched = false; moveCam(fitCam(mode), 380); });
    $("step-prev").addEventListener("click", () => step(-1));
    $("step-next").addEventListener("click", () => step(1));
    $("theme").addEventListener("click", () => {
      const dark = doc.dataset.theme ? doc.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      doc.dataset.theme = dark ? "light" : "dark";
    });
    window.addEventListener("resize", () => { if (!touched && P) { cam = fitCam(mode); applyCam(); } });

    // ---- Header, the author's claim, and what the canvas does not show ----
    const counts = META.counts;
    const CLAIM = META.claim;
    const kindName = { file: "File", endpoint: "Endpoint", pr: CLAIM && CLAIM.number ? `Pull request #${CLAIM.number}` : "Change" };
    $("kind").textContent = kindName[META.kind] || META.kind;
    $("title").textContent = META.title;
    $("title").title = META.title;
    document.title = META.title + " · breakdown";
    const stats = [`${counts.blocks} blocks`, `${counts.arrows} arrows`, `${counts.files} ${counts.files === 1 ? "file" : "files"}`];
    if (counts.changed !== undefined) stats.push(`${counts.changed} changed`, `${counts.added} new`, `${counts.deleted} deleted`);
    // A commit sha is cut to 12 characters; a branch name is shown whole. The pair wraps as one piece.
    const ref = (r) => /^[0-9a-f]{13,40}$/i.test(r) ? r.slice(0, 12) : r;
    if (META.base) stats.push(`${ref(META.base)}\u00a0→\u00a0${META.head ? ref(META.head) : "working\u00a0tree"}`);
    $("stats").textContent = stats.join(" · ");
    if (CLAIM) {
      const btn = $("claim-btn");
      btn.hidden = false;
      const from = CLAIM.source === "commits" ? "From the commit messages, oldest first" : "From the pull request";
      $("claim-src").innerHTML = esc(from) + (CLAIM.url ? ` · <a href="${esc(CLAIM.url)}" target="_blank" rel="noopener">${esc(CLAIM.url)}</a>` : "");
      $("claim-title").textContent = CLAIM.title || "Author's claim";
      if (CLAIM.commits && CLAIM.commits.length) {
        // One entry per commit: its short sha, its subject, then the rest of its message, all verbatim.
        $("claim-body").hidden = true;
        const list = $("claim-commits");
        list.hidden = false;
        list.innerHTML = CLAIM.commits.map((c) => {
          const cut = c.message.indexOf("\n");
          const subject = cut < 0 ? c.message : c.message.slice(0, cut);
          const rest = cut < 0 ? "" : c.message.slice(cut + 1).trim();
          return `<li><span class="sha">${esc(c.sha)}</span><span class="subject">${esc(subject)}</span>` +
            (rest ? `<pre>${esc(rest)}</pre>` : "") + "</li>";
        }).join("");
      } else {
        $("claim-body").textContent = CLAIM.body && CLAIM.body.trim() ? CLAIM.body : "This pull request has no description.";
      }
      btn.addEventListener("click", () => { $("claim").hidden = !$("claim").hidden; });
      $("claim-close").addEventListener("click", () => { $("claim").hidden = true; });
    }
    const notShown = [
      "Runtime order, and calls made through dynamic dispatch or reflection",
      "What happens when a call fails at runtime",
      "Tests, and code outside these blocks",
      "Why the code exists; read the ticket or the PR description",
    ];
    if (META.unreached && META.unreached.length) notShown.unshift(`Not reached from the entry point: ${META.unreached.join(", ")}`);
    $("not-shown").innerHTML = notShown.map((t) => `<li>${esc(t)}</li>`).join("");

    // ---- First draw ----
    function calibrate() {
      const probe = document.createElement("span");
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-family:var(--font-code);font-size:11px;font-variant-ligatures:none";
      probe.textContent = "M".repeat(200);
      document.body.appendChild(probe);
      const w = probe.getBoundingClientRect().width / 200;
      probe.remove();
      if (w > 3 && Math.abs(w - C.CHAR_W) > 0.04) doc.style.setProperty("--code-size", (11 * C.CHAR_W / w).toFixed(3) + "px");
    }
    calibrate();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(calibrate);
    sizeBoxes(DATA.layouts[mode].boxes);
    buildFrames(DATA.layouts[mode].boxes);
    setMode(mode, false);
  }
})();
</script>
</body>
</html>
